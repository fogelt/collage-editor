[package]
name = "collage-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A simple desktop collage editor"
license = "MIT"

[dependencies]
display-info = "0.5"
iced = { version = "0.14", default-features = false, features = [
    "canvas",
    "crisp",
    "image-without-codecs",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "web-colors",
    "x11",
] }
iced_font_awesome = "0.4"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
rayon = "1.11"
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Keep `cargo run` usable while developing: image decoding and the software
# renderer are the hot paths, so optimizing dependencies (but not our own
# crate) cuts startup and drag latency dramatically without hurting rebuilds.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.packager]
product_name = "Collage Editor"
identifier = "com.fogelt.collageeditor"
version = "0.1.0"
description = "Arrange photos into a collage and export it."
authors = ["fogelt"]
publisher = "fogelt"
homepage = "https://github.com/fogelt/collage-editor"
category = "Photography"
copyright = "2026, fogelt"

before_packaging_command = "cargo build --release --locked"

icons = ["assets/icons/icon.ico", "assets/icons/icon-512.png"]
formats = ["nsis", "dmg", "deb", "appimage"]

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[package.metadata.packager.deb]
priority = "optional"
section = "graphics"
depends = ["libc6", "libfontconfig1", "libwayland-client0", "libxkbcommon0"]
